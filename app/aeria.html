<title>AerIA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root { --mascara-iso: url("__ISO__"); --mascara-wordmark: url("__WORDMARK__"); }
/*__CSS__*/
</style>

<header class="banda">
  <div class="envoltura banda-in">
    <div class="firma">
      <span class="iso" id="iso-banda" aria-hidden="true"></span>
      <h1 class="nombre" aria-label="AerIA">AER<span class="ia">IA</span></h1>
      <div class="sub-firma">
        <span class="wordmark" role="img" aria-label="Aéreo"></span>
        <small>Centro de mando</small>
      </div>
    </div>
    <div class="banda-estado" id="banda-estado"></div>
  </div>
</header>

<nav class="pestanas" aria-label="Secciones">
  <div class="envoltura pestanas-in" role="tablist" id="pestanas">
    <button class="pestana" role="tab" id="tab-mando" aria-controls="v-mando" aria-selected="true" data-tab="mando">Hoy <span class="cuenta" id="cuenta-criticas" hidden></span></button>
    <button class="pestana" role="tab" id="tab-pasado" aria-controls="v-pasado" aria-selected="false" data-tab="pasado">La plata</button>
    <button class="pestana" role="tab" id="tab-presente" aria-controls="v-presente" aria-selected="false" data-tab="presente">Cursos y cobros</button>
    <button class="pestana" role="tab" id="tab-comercial" aria-controls="v-comercial" aria-selected="false" data-tab="comercial">Ventas <span class="cuenta" id="cuenta-comercial" hidden></span></button>
    <button class="pestana" role="tab" id="tab-futuro" aria-controls="v-futuro" aria-selected="false" data-tab="futuro">2027</button>
    <button class="pestana hablar" role="tab" id="tab-hablar" aria-controls="v-hablar" aria-selected="false" data-tab="hablar"><span class="iso" aria-hidden="true"></span>Pregúntale a AerIA</button>
  </div>
</nav>

<main class="envoltura">
  <section class="vista" id="v-mando" role="tabpanel" aria-labelledby="tab-mando"></section>
  <section class="vista" id="v-pasado" role="tabpanel" aria-labelledby="tab-pasado" hidden></section>
  <section class="vista" id="v-presente" role="tabpanel" aria-labelledby="tab-presente" hidden></section>
  <section class="vista" id="v-comercial" role="tabpanel" aria-labelledby="tab-comercial" hidden></section>
  <section class="vista" id="v-futuro" role="tabpanel" aria-labelledby="tab-futuro" hidden></section>
  <section class="vista" id="v-hablar" role="tabpanel" aria-labelledby="tab-hablar" hidden></section>
</main>

<footer class="envoltura pie" id="pie"></footer>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script id="aeria-datos" type="application/json">__DATOS__</script>
